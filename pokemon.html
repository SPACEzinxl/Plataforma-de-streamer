<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nobre+ | Pokémon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=6">
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <a href="index.html" class="logo-link" title="Nobre+"><img src="images/nobre-logo.png" alt="Nobre+" class="nav-brand-logo"></a>
        </div>
        <div class="nav-right">
            <img src="https://i.pinimg.com/736x/88/43/c1/8843c1bb59dcce43cd4c46b7e39220e2.jpg" alt="Perfil" class="profile-avatar">
        </div>
    </nav>

    <main>
        <section class="pokemon-hero">
            <div class="pokemon-hero-bg"></div>
            <div class="pokemon-hero-content">
                <h1 class="pokemon-title">POKÉMON</h1>
                <p class="pokemon-subtitle">Gotta catch 'em all! Todos os filmes, só no Nobre+</p>
                <a href="index.html" class="back-home-btn"><span class="material-symbols-outlined">arrow_back</span> Voltar</a>
            </div>
        </section>

        <section class="pokemon-grid-section">
            <h2>Filmes Pokémon no Nobre+</h2>
            <div id="pokemonSections"></div>
        </section>
    </main>

    <script src="theme.js?v=5"></script>
    <script src="movies-data.js?v=10"></script>
    <script src="database.js?v=5"></script>
    <script>
        if (!DB.isLoggedIn()) {
            window.location.href = 'login.html';
        }

        const pokemonSections = [
            {
                title: "Saga Clássica",
                keys: [
                    "pokemon-movie-mewtwo-contro-ataque",
                    "pokemon-2-o-poder-um-so",
                    "pokemon-3-o-feitico-dos-unown",
                    "pokemon-4-viajantes-do-tempo",
                    "pokemon-herois"
                ]
            },
            {
                title: "Aventuras Modernas",
                keys: [
                    "pokemon-lucario-e-o-misterio-de-mew",
                    "pokemon-os-pokemon-o-poder-de-todos",
                    "pokemon-i-o-pikachu-e-o-pokemon-selvagem",
                    "pokemon-mewtwo-strikes-back",
                    "pokemon-segredos-da-selva",
                    "pokemon-detective-pikachu"
                ]
            }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            const sectionsHost = document.getElementById('pokemonSections');
            if (!sectionsHost) return;

            pokemonSections.forEach(section => {
                const sec = document.createElement('section');
                sec.className = 'pokemon-grid-section';

                const title = document.createElement('h2');
                title.textContent = section.title;

                const grid = document.createElement('div');
                grid.className = 'pokemon-movies-grid';

                section.keys.forEach(key => {
                    const movie = moviesDatabase[key];
                    if (!movie) return;
                    const thumb = movie.thumb || movie.heroImg;

                    const card = document.createElement('a');
                    card.href = `detalhes.html?id=${key}`;
                    card.className = 'pokemon-movie-card';

                    const img = document.createElement('img');
                    img.src = thumb;
                    img.alt = movie.title;
                    img.loading = 'lazy';
                    img.onerror = () => posterFallback(img, movie.title);

                    const overlay = document.createElement('div');
                    overlay.className = 'pokemon-card-overlay';

                    const name = document.createElement('h4');
                    name.textContent = movie.title;

                    const meta = document.createElement('div');
                    meta.className = 'card-meta';

                    const age = document.createElement('span');
                    age.className = `badge-age ${movie.ageClass || 'r12'}`;
                    age.textContent = movie.age || 'L';

                    const res = document.createElement('span');
                    res.className = 'badge-res';
                    res.textContent = movie.res || 'HD';

                    meta.appendChild(age);
                    meta.appendChild(res);
                    overlay.appendChild(name);
                    overlay.appendChild(meta);
                    card.appendChild(img);
                    card.appendChild(overlay);
                    grid.appendChild(card);
                });

                sec.appendChild(title);
                sec.appendChild(grid);
                sectionsHost.appendChild(sec);
            });
        });
    </script>
</body>
</html>
