<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nobre+ | Star Wars</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=9">
</head>
<body class="starwars-page-body">

    <!-- NAVEGAÇÃO SUPERIOR -->
    <nav class="navbar">
        <div class="nav-left">
            <a href="index.html" class="logo-link" title="Nobre+"><img src="images/nobre-logo.png" alt="Nobre+" class="nav-brand-logo"></a>
            <ul class="nav-links">
                <li><a href="index.html"><span class="material-symbols-outlined">home</span> Início</a></li>
                <li><a href="#" class="active"><i class="fa-solid fa-star"></i> Star Wars</a></li>
                <li><a href="index.html"><i class="fa-solid fa-square-plus"></i> Minha Lista</a></li>
            </ul>
        </div>
        <div class="nav-right">
            <a href="index.html" class="back-home-pill"><span class="material-symbols-outlined">arrow_back</span> Início</a>
            <img src="https://i.pinimg.com/736x/88/43/c1/8843c1bb59dcce43cd4c46b7e39220e2.jpg" alt="Perfil" class="profile-avatar">
        </div>
    </nav>

    <main class="marvel-main">
        <!-- BANNER DE FUNDO STAR WARS -->
        <div class="starwars-backdrop-bg"></div>

        <!-- HERO BRAND BANNER -->
        <section class="marvel-page-header">
            <img src="https://upload.wikimedia.org/wikipedia/commons/6/6c/Star_Wars_Logo.svg" alt="Star Wars" class="marvel-header-logo">
            <p class="marvel-header-sub">Que a Força esteja com você, em todos os filmes do Nobre+</p>
        </section>

        <!-- TODOS OS FILMES STAR WARS -->
        <section class="marvel-saga-section">
            <h2 class="saga-title">Todos os Filmes Star Wars</h2>
            <div class="saga-row-wrapper">
                <button class="row-nav-btn prev-btn" aria-label="Voltar"><span class="material-symbols-outlined">chevron_left</span></button>
                <div class="saga-row" id="starwarsRow"></div>
                <button class="row-nav-btn next-btn" aria-label="Avançar"><span class="material-symbols-outlined">chevron_right</span></button>
            </div>
        </section>
    </main>

    <script src="theme.js?v=5"></script>
    <script src="movies-data.js?v=10"></script>
    <script src="database.js?v=5"></script>
    <script>
        const starwarsKeys = [
            "star-wars-uma-nova-esperanca",
            "star-wars-imperio-contra-ataca",
            "star-wars-retorno-do-jedi",
            "star-wars-ameaca-fantasma",
            "star-wars-despertar-da-forca",
            "star-wars-rogue-one"
        ];

        document.addEventListener('DOMContentLoaded', () => {
            if (!DB.requireLogin()) return;
            function renderSagaRow(keys, containerId) {
                const container = document.getElementById(containerId);
                if (!container) return;

                keys.forEach(key => {
                    const movie = moviesDatabase[key];
                    if (!movie) return;
                    const posterImg = movie.thumb || movie.heroImg;

                    const card = document.createElement('a');
                    card.href = `detalhes.html?id=${key}`;
                    card.className = 'marvel-poster-card';
                    card.setAttribute('data-movie-key', key);

                    const img = document.createElement('img');
                    img.src = posterImg;
                    img.alt = movie.title;
                    img.className = 'marvel-poster-img';
                    img.width = 200;
                    img.height = 300;
                    img.loading = 'lazy';
                    img.onerror = () => posterFallback(img, movie.title);

                    card.appendChild(img);
                    container.appendChild(card);
                });
            }

            renderSagaRow(starwarsKeys, 'starwarsRow');

            // Scroll horizontal com mouse wheel, botões e arrastar
            document.querySelectorAll('.saga-row-wrapper').forEach(wrapper => {
                const row = wrapper.querySelector('.saga-row');
                const prevBtn = wrapper.querySelector('.prev-btn');
                const nextBtn = wrapper.querySelector('.next-btn');

                if (row) {
                    row.addEventListener('wheel', (e) => {
                        if (e.deltaY !== 0) {
                            e.preventDefault();
                            row.scrollLeft += e.deltaY * 1.5;
                        }
                    }, { passive: false });

                    if (prevBtn) {
                        prevBtn.addEventListener('click', () => {
                            row.scrollBy({ left: -600, behavior: 'smooth' });
                        });
                    }

                    if (nextBtn) {
                        nextBtn.addEventListener('click', () => {
                            row.scrollBy({ left: 600, behavior: 'smooth' });
                        });
                    }

                    let isDown = false;
                    let startX;
                    let scrollLeft;

                    row.addEventListener('mousedown', (e) => {
                        isDown = true;
                        startX = e.pageX - row.offsetLeft;
                        scrollLeft = row.scrollLeft;
                    });
                    row.addEventListener('mouseleave', () => { isDown = false; });
                    row.addEventListener('mouseup', () => { isDown = false; });
                    row.addEventListener('mousemove', (e) => {
                        if (!isDown) return;
                        e.preventDefault();
                        const x = e.pageX - row.offsetLeft;
                        const walk = (x - startX) * 1.5;
                        row.scrollLeft = scrollLeft - walk;
                    });
                }
            });
        });
    </script>
</body>
</html>
