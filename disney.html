</head>
<body class="disney-page-body">

    <!-- NAVEGAÇÃO SUPERIOR -->

            <ul class="nav-links">
                <li><a href="index.html"><span class="material-symbols-outlined">home</span> Início</a></li>
                <li><a href="#" class="active"><i class="fa-solid fa-wand-magic-sparkles"></i> Disney</a></li>
                <li><a href="index.html"><i class="fa-solid fa-square-plus"></i> Minha Lista</a></li>

    <main class="disney-main">

        <!-- HERO BRAND BANNER -->

            <img src="https://cdn.freebiesupply.com/logos/large/2x/disney-logo-png-transparent.png" alt="Disney" class="disney-header-logo">
            <p class="disney-header-sub">A magia que encanta gerações, só no Nobre+</p>
        </section>

        <!-- LANÇAMENTOS EM DESTAQUE -->
        <section class="disney-section">
            <div class="section-header">
                <h2 class="section-title"><span class="material-symbols-outlined">star</span> Lançamentos e Destaques</h2>
            </div>
            <div class="saga-row-wrapper">
                <button class="row-nav-btn prev-btn" aria-label="Voltar"><span class="material-symbols-outlined">chevron_left</span></button>
                <div class="saga-row" id="disneyDestaquesRow"></div>
                <button class="row-nav-btn next-btn" aria-label="Avançar"><span class="material-symbols-outlined">chevron_right</span></button>
            </div>
        </section>

        <!-- CLÁSSICOS DA ANIMAÇÃO -->

            <div class="section-header">
                <h2 class="section-title"><span class="material-symbols-outlined">movie</span> Clássicos da Animação</h2>
            </div>
            <div class="saga-row-wrapper">
                <button class="row-nav-btn prev-btn" aria-label="Voltar"><span class="material-symbols-outlined">chevron_left</span></button>
                <div class="saga-row" id="disneyClassicosRow"></div>
                <button class="row-nav-btn next-btn" aria-label="Avançar"><span class="material-symbols-outlined">chevron_right</span></button>
            </div>
        </section>

        <!-- PRINCESAS E CONTOS DE FADAS -->
        <section class="disney-section">
            <div class="section-header">
                <h2 class="section-title"><span class="material-symbols-outlined">auto_awesome</span> Princesas e Contos de Fadas</h2>
            </div>
            <div class="saga-row-wrapper">
                <button class="row-nav-btn prev-btn" aria-label="Voltar"><span class="material-symbols-outlined">chevron_left</span></button>
                <div class="saga-row" id="disneyPrincesasRow"></div>
                <button class="row-nav-btn next-btn" aria-label="Avançar"><span class="material-symbols-outlined">chevron_right</span></button>
            </div>
        </section>

        <!-- AVENTURA E FANTASIA -->
        <section class="disney-section">
            <div class="section-header">
                <h2 class="section-title"><span class="material-symbols-outlined">explore</span> Aventura e Fantasia</h2>
            </div>
            <div class="saga-row-wrapper">
                <button class="row-nav-btn prev-btn" aria-label="Voltar"><span class="material-symbols-outlined">chevron_left</span></button>
                <div class="saga-row" id="disneyAventuraRow"></div>
                <button class="row-nav-btn next-btn" aria-label="Avançar"><span class="material-symbols-outlined">chevron_right</span></button>
            </div>
        </section>

        <!-- FILMES EM BREVE -->
        <section class="disney-section">
            <div class="section-header">
                <h2 class="section-title"><span class="material-symbols-outlined">schedule</span> Em Breve / Futuros Lançamentos</h2>
            </div>
            <div class="saga-row-wrapper">
                <button class="row-nav-btn prev-btn" aria-label="Voltar"><span class="material-symbols-outlined">chevron_left</span></button>
                <div class="saga-row" id="disneyBreveRow"></div>
                <button class="row-nav-btn next-btn" aria-label="Avançar"><span class="material-symbols-outlined">chevron_right</span></button>
            </div>
        </section>
    </main>

    <script src="theme.js?v=5"></script>
    <script src="movies-data.js?v=10"></script>
    <script src="database.js?v=5"></script>
    <script>
        // ==========================================
        // CHAVES DOS FILMES DISNEY POR CATEGORIA
        // ==========================================
        const disneyCategories = {
            destaques: [
                "moana-2",
                "mufasa-o-rei-leao",
                "avatar-o-caminho-da-agua",
                "divertida-mente-2",
                "elementos",
                "lightyear",
                "toy-story-5",
                "elio",
                "hoppers"
            ],
            classicos: [
                "toy-story",
                "toy-story-2",
                "toy-story-3",
                "toy-story-4",
                "procurando-nemo",
                "procurando-dory",
                "monstros-sa",
                "universidades",
                "os-incriveis",
                "os-incriveis-2",
                "ratatouille",
                "wall-e",
                "up-altas-aventuras",
                "divertida-mente",
                "viva-a-vida-e-uma-festa",
                "onward",
                "soul",
                "luca",
                "red-crescer-e-uma-fera",
                "carros",
                "carros-2",
                "carros-3",
                "vida-de-inseto",
                "valente",
                "zotopia"
            ],
            princesas: [
                "mufasa-o-rei-leao",
                "moana-2",
                "divertida-mente",
                "divertida-mente-2",
                "viva-a-vida-e-uma-festa",
                "valente",
                "red-crescer-e-uma-fera"
            ],
            aventura: [
                "avatar-o-caminho-da-agua",
                "moana-2",
                "up-altas-aventuras",
                "procurando-nemo",
                "procurando-dory",
                "wall-e",
                "luca",
                "onward",
                "elementos",
                "lightyear",
                "elio",
                "hoppers",
                "carros",
                "carros-2",
                "carros-3",
                "valente",
                "o-bom-dinossauro",
                "vida-de-inseto",
                "zotopia",
                "monstros-sa",
                "universidades"
            ],
            breve: [
                "toy-story-5",
                "elio",
                "hoppers"
            ]
        };

        document.addEventListener('DOMContentLoaded', () => {
            if (!DB.requireLogin()) return;

            function renderSagaRow(keys, containerId) {
                const container = document.getElementById(containerId);
                if (!container) return;

                keys.forEach(key => {
                    const movie = moviesDatabase[key];
                    if (!movie) return;
                    const posterImg = movie.thumb || movie.heroImg;

                    const card = document.createElement('a');
                    card.href = `detalhes.html?id=${key}`;
                    card.className = 'marvel-poster-card';
                    card.setAttribute('data-movie-key', key);

                    const img = document.createElement('img');
                    img.src = posterImg;
                    img.alt = movie.title;
                    img.className = 'marvel-poster-img';
                    img.width = 200;
                    img.height = 300;
                    img.loading = 'lazy';
                    img.onerror = () => posterFallback(img, movie.title);

                    card.appendChild(img);
                    container.appendChild(card);
                });
            }

            // Renderizar todas as categorias
            Object.entries(disneyCategories).forEach(([category, keys]) => {
                renderSagaRow(keys, `disney${category.charAt(0).toUpperCase() + category.slice(1)}Row`);
            });

            // Scroll horizontal com mouse wheel, botões e arrastar
            document.querySelectorAll('.saga-row-wrapper').forEach(wrapper => {
                const row = wrapper.querySelector('.saga-row');
                const prevBtn = wrapper.querySelector('.prev-btn');
                const nextBtn = wrapper.querySelector('.next-btn');

                if (row) {
                    row.addEventListener('wheel', (e) => {
                        if (e.deltaY !== 0) {
                            e.preventDefault();
                            row.scrollLeft += e.deltaY * 1.5;
                        }
                    }, { passive: false });

                    if (prevBtn) {
                        prevBtn.addEventListener('click', () => {
                            row.scrollBy({ left: -600, behavior: 'smooth' });
                        });
                    }

                    if (nextBtn) {
                        nextBtn.addEventListener('click', () => {
                            row.scrollBy({ left: 600, behavior: 'smooth' });
                        });
                    }

                    let isDown = false;
                    let startX;
                    let scrollLeft;

                    row.addEventListener('mousedown', (e) => {
                        isDown = true;
                        startX = e.pageX - row.offsetLeft;
                        scrollLeft = row.scrollLeft;
                    });
                    row.addEventListener('mouseleave', () => { isDown = false; });
                    row.addEventListener('mouseup', () => { isDown = false; });
                    row.addEventListener('mousemove', (e) => {
                        if (!isDown) return;
                        e.preventDefault();
                        const x = e.pageX - row.offsetLeft;
                        const walk = (x - startX) * 1.5;
                        row.scrollLeft = scrollLeft - walk;
                    });
                }
            });
        });
    </script>
</body>
</html>
